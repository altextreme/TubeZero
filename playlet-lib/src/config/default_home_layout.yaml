# YourTube: a deep Home like the YouTube TV app. Rows load lazily as they scroll into view
# (VideoRowList loads the focused row +/- 3) and rows that come back empty are dropped.
# "Recommended" expands into one row per shelf of the signed-in YouTube home.
# optional: true  = the row disappears quietly if its source fails (no error dialog).
# defaultEnabled: false = listed in Settings > Edit home screen but off until the user turns it on.
# "Live now from your subscriptions" disappears when none of your channels is live (or signed out).
- title: Live now from your subscriptions
  id: subscriptions_live
  feedSources:
    - id: yt_subscriptions_live
      title: Live now
      apiType: Invidious
      endpoint: yt_subscriptions_live
      optional: true

- title: Recommended
  id: recommended
  feedSources:
    - id: yt_home_shelves
      title: Recommended
      apiType: Invidious
      endpoint: yt_home_shelves

- title: Subscriptions
  id: subscriptions
  feedSources:
    - id: inv_auth_feed
      title: Subscriptions
      apiType: Invidious
      endpoint: auth_feed

- title: Watch history
  id: watch_history
  feedSources:
    - id: inv_auth_history
      title: Watch history
      apiType: Invidious
      endpoint: watch_history

- title: Live now
  id: trending_livestreams
  feedSources:
    - id: inv_trending_livestreams
      title: Live now
      apiType: Invidious
      endpoint: trending
      optional: true
      queryParams:
        type: Livestreams

- title: Music
  id: music
  feedSources:
    # "Top 100 Music Videos Global" chart playlist
    - id: yt_music_top_videos
      title: Music
      apiType: Invidious
      endpoint: playlist
      optional: true
      pathParams:
        plid: PL4fGSI1pDJn5kI81J1fYWK5eZRl1zJ5kM

- title: Gaming
