# YourTube: feeds for the Subscriptions nav screen (ids differ from Home's so Home's layout
# preference does not hide them)
- title: Subscriptions
  id: yt_subscriptions
  feedSources:
    - id: inv_auth_feed
      title: Subscriptions
      apiType: Invidious
      endpoint: auth_feed

# Live now from your subscriptions: the row above the grid, and the "Live now" chip's source
- title: Live now
  id: yt_subscriptions_live_row
  feedSources:
    - id: yt_subscriptions_live
      title: Live now
      apiType: Invidious
      endpoint: yt_subscriptions_live
      optional: true
